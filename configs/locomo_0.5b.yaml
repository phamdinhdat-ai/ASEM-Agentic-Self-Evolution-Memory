inference:
  backend: "huggingface"  # "langchain" | "huggingface"
  huggingface:
    model_name_or_path: "Qwen/Qwen2.5-0.5B-Instruct"
    device_map: "auto"
    load_in_4bit: false
    pipeline_task: "text-generation"
    max_new_tokens: 256
    temperature: 0.0
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  k2: 5
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

# NGMC write gate — skip the S2 LLM for clearly-novel (ADD) / near-duplicate (NOOP) turns
write_gate:
  enabled: true
  tau_high: 0.45      # novelty = 1 - max_sim; ADD when novelty >= tau_high
  tau_redund: 0.92    # NOOP when max_sim >= tau_redund (near-duplicate)
link_tau: 0.35        # only feed the S3 link LLM neighbors at/above this cosine

# LLM output retry — on parse/schema failure, re-issue the prompt with a format
# correction block quoting the previous bad output (0 = disabled, single-shot)
llm_retry:
  max_retries: 2      # small models (0.5B) need retries to converge on JSON
