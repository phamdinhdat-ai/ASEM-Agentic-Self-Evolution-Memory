# Fast-ASEM preset: Deep Research & Evolution Configuration
# Full theoretical mode with active RL write operations, dynamic linking, and active bidirectional evolution.

preset: "deep_evolution"

inference:
  backend: "langchain"
  langchain:
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.2
    max_tokens: 4096
    embedder_provider: "huggingface"
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  k2: 5
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

write_gate:
  enabled: true
  tau_high: 0.45
  tau_redund: 0.92

retriever:
  mode: "enhanced"
  use_bm25: true
  use_entity_filter: true
  use_temporal_boost: true
  max_hops: 2
  hop_decay: 0.70
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.7
  entity_weight: 0.5
  temporal_weight: 0.4

answer:
  direct_mode: false  # uses two-phase distillation
  include_dates: true
  max_context_notes: 6
  max_tokens: 512
  temperature: 0.1

ingestion:
  mode: "turn_by_turn"
  lazy_evolution: false
  link_tau: 0.35
  max_notes_per_session: 20

link_tau: 0.35
llm_retry:
  max_retries: 2

logging:
  level: "INFO"
