inference:
  backend: "langchain"
  langchain:
    provider: "openai"
    model: "deepseek-v4-flash"          # using ckey.vn proxy; swap to gpt-4o, gpt-4o-mini, etc.
    temperature: 0.0
    embedder_provider: "huggingface"
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"  # cheap + fast; swap to text-embedding-3-large for higher quality

hyperparameters:
  k1: 20
  k2: 5
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

# Optional: configure loguru logging
# Set LOG_LEVEL env var or use the level below. File logging is optional.
logging:
  level: "DEBUG"               # TRACE, DEBUG, INFO, SUCCESS, WARNING, ERROR, CRITICAL
  log_file: "logs/asem.log"    # set to null to disable file logging
  rotation: "10 MB"
  retention: "7 days"
  serialize_json: false
