# Judge backbone — OpenAI-compatible API (LLM-as-a-judge)
# ---------------------------------------------------------------------------
# Used ONLY by the judge stage of `scripts/run_static_eval.py --metrics judge`.
# It is never used to ingest or to build a memory bank, so its `phase` block is
# inert; it exists because the config validator expects every registered config
# to carry the full block set.
#
# Judge calls are single-turn, deterministic, and short: keep `temperature: 0.0`
# and a modest `max_tokens` (the judge must return a small JSON object).
#
# `embedder_name` is declared for registry uniformity only.
#
#   python scripts/run_static_eval.py \
#       --config configs/models/gpt54_api.yaml \
#       --judge-config configs/models/judge_api.yaml --metrics judge
#
# ⚠️  MODEL ID ENTITLEMENT — READ BEFORE CHANGING `model:` BELOW
# ---------------------------------------------------------------------------
# This file previously declared `model: "deepseek-v4-flash"`, which the account
# key is NO LONGER ENTITLED TO. A judge call to that id returns
#     403 FORBIDDEN: Please subscribe to model in the API Key: deepseek-v4-flash
# and the judge stage FAILS SILENTLY: each row's exception is swallowed into
# `judge_error` with `judge_correct=None`, and the aggregate then reports
#      judge: 0.0, judge_coverage: 0.0
# i.e. a total judge outage is indistinguishable from "the judge disagreed with
# every answer". Measured 2026-10-03 on `--limit 3`: 3/3 rows errored, printed
# 0.0. (`data/benchmarks/results/longmemeval/ws4_bootstrap/scores/*.jsonl`.)
#
# Entitlement is a property of the API KEY, not of this repo, so it can change
# again. The endpoint currently advertises EXACTLY ONE model:
#     GET https://api.vilao.ai/v1/models  ->  ['deepseek-v4.1-flash']
# Probe before trusting any judge run:
#     python scripts/check_judge_entitlement.py
# ALWAYS report `judge_coverage` next to any judge score. A judge number with
# coverage != 1.0 is not a result — see analysis/temporal_grounding_improvements.md §3.
# ---------------------------------------------------------------------------
preset: "custom"

inference:
  backend: "langchain"
  langchain:
    provider: "openai"
    # Was "deepseek-v4-flash" (403 NOT ENTITLED — silent zero judge). The repo's
    # own `-`/`chib/` prefix convention; both this and the bare
    # "deepseek-v4.1-flash" verify as 200. Kept identical to
    # configs/models/judge_v41_flash.yaml so the two judge configs cannot diverge
    # into one working and one silently-failing arm.
    model: "chib/deepseek-v4.1-flash"
    temperature: 0.0
    # Must cover REASONING + the small verdict JSON, or the model can return
    # an empty string (finish_reason="length").
    max_tokens: 2048
    enable_reasoning: false
    embedder_provider: "huggingface"
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  k2: 5
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

write_gate:
  enabled: true
  tau_high: 0.45
  tau_redund: 0.92

retriever:
  mode: "rrf"
  use_bm25: true
  use_entity_filter: true
  use_temporal_boost: true
  max_hops: 2
  hop_decay: 0.70
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.8
  entity_weight: 0.6
  temporal_weight: 0.5

answer:
  direct_mode: true
  include_dates: true
  max_context_notes: 8
  content_char_limit: 200
  max_tokens: 512
  temperature: 0.0

ingestion:
  mode: "session_batch"
  lazy_evolution: true
  link_tau: 0.35
  max_notes_per_session: 20

link_tau: 0.35

llm_retry:
  max_retries: 1

phase:
  mode: "combined"
  bank_tag: "judge"
  ingest_config: null

logging:
  level: "INFO"
  log_file: null
