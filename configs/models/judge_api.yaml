# Judge backbone — OpenAI-compatible API (LLM-as-a-judge)
# ---------------------------------------------------------------------------
# Used ONLY by the judge stage of `scripts/run_static_eval.py --metrics judge`.
# It is never used to ingest or to build a memory bank, so its `phase` block is
# inert; it exists because the config validator expects every registered config
# to carry the full block set.
#
# Judge calls are single-turn, deterministic, and short: keep `temperature: 0.0`
# and a modest `max_tokens` (the judge must return a small JSON object).
#
# `embedder_name` is declared for registry uniformity only.
#
#   python scripts/run_static_eval.py \
#       --config configs/models/gpt54_api.yaml \
#       --judge-config configs/models/judge_api.yaml --metrics judge
# ---------------------------------------------------------------------------
preset: "custom"

inference:
  backend: "langchain"
  langchain:
    provider: "openai"
    model: "deepseek-v4-flash"
    temperature: 0.0
    # Must cover REASONING + the small verdict JSON, or the model can return
    # an empty string (finish_reason="length").
    max_tokens: 2048
    enable_reasoning: false
    embedder_provider: "huggingface"
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  k2: 5
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

write_gate:
  enabled: true
  tau_high: 0.45
  tau_redund: 0.92

retriever:
  mode: "rrf"
  use_bm25: true
  use_entity_filter: true
  use_temporal_boost: true
  max_hops: 2
  hop_decay: 0.70
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.8
  entity_weight: 0.6
  temporal_weight: 0.5

answer:
  direct_mode: true
  include_dates: true
  max_context_notes: 8
  max_tokens: 512
  temperature: 0.0

ingestion:
  mode: "session_batch"
  lazy_evolution: true
  link_tau: 0.35
  max_notes_per_session: 20

link_tau: 0.35

llm_retry:
  max_retries: 1

phase:
  mode: "combined"
  bank_tag: "judge"
  ingest_config: null

logging:
  level: "INFO"
  log_file: null
