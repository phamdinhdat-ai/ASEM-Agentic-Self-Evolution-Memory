# DeepSeek — NATIVE openai-SDK backend (no LangChain in the request path)
# ---------------------------------------------------------------------------
# Same endpoint and model as `deepseek_api.yaml`, but calls go straight through
# the official `openai` client (`client.chat.completions.create`) instead of
# LangChain's ChatOpenAI wrapper. Pick this with `backend: "openai"`.
#
# Endpoint + key from .env: OPENAI_BASE_URL (https://api.deepseek.com),
# OPENAI_API_KEY. You can also pin them per-config with `base_url` / `api_key`.
#
# Embeddings are built by the SAME embedder factory the LangChain backend uses,
# so vectors are identical and banks built with `deepseek_api.yaml` (backend:
# "langchain") can be mixed with banks built here. `embedder_name` MUST stay
# `sentence-transformers/all-MiniLM-L6-v2` — it is the one invariant shared by
# every config in this directory.
#
# IMPORTANT: `max_tokens` must cover REASONING + OUTPUT. The v4 models think
# before answering and reasoning tokens count against the cap; too small a
# budget returns finish_reason="length" with empty content -> a 0-note bank.
#
#   python scripts/build_static_banks.py --ingest-config configs/models/deepseek_openai.yaml
#   python scripts/run_static_eval.py   --config        configs/models/deepseek_openai.yaml
# ---------------------------------------------------------------------------
preset: "custom"

inference:
  backend: "openai"
  openai:
    model: "deepseek-v4-flash"
    temperature: 0.3
    max_tokens: 4096
    timeout: 120          # seconds; long extraction calls need generous headroom

    # ---- Thinking control (OpenAI-compatible format on this endpoint) -------
    #   thinking:         {"type": "enabled" | "disabled"}   <- toggle
    #   reasoning_effort: "low" | "high" | "max"             <- effort
    #
    # Thinking is ON by default; its tokens count against `max_tokens`, so
    # disabling it cuts both latency and cost for bulk ingestion. If extraction
    # quality drops, try `reasoning_effort: "low"`, or delete this block and
    # compare the `extracted=` counts in the ingest log.
    thinking:
      type: "disabled"

    # Anything else can be hand-written as a raw body override.
    # extra_body:
    #   some_server_flag: 1

    embedder_provider: "huggingface"
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  k2: 5
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

write_gate:
  enabled: true
  tau_high: 0.45
  tau_redund: 0.92

retriever:
  mode: "rrf"
  use_bm25: true
  use_entity_filter: true
  use_temporal_boost: true
  max_hops: 2
  hop_decay: 0.70
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.8
  entity_weight: 0.6
  temporal_weight: 0.5

answer:
  direct_mode: true
  include_dates: true
  max_context_notes: 8
  max_tokens: 512
  temperature: 0.0

ingestion:
  mode: "session_batch"
  lazy_evolution: true
  link_tau: 0.35
  max_notes_per_session: 20

link_tau: 0.35

llm_retry:
  max_retries: 1

phase:
  mode: "combined"
  bank_tag: "deepseek_openai"
  ingest_config: null

logging:
  level: "INFO"
  log_file: null
