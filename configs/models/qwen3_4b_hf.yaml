# Qwen3-4B — local HuggingFace backend
# ---------------------------------------------------------------------------
# Phase-separated benchmark backbone config (~4B params).
#
# CPU note: 4B in float32 needs ~16 GB RAM. On CPU prefer
#   torch_dtype: "bfloat16"   (or serve it via vLLM and use the API variant).
# On a CUDA GPU you may set load_in_4bit: true (bitsandbytes).
#
# IMPORTANT: `embedder_name` MUST match every other config in `configs/models/`.
# ---------------------------------------------------------------------------
preset: "custom"

inference:
  backend: "huggingface"
  huggingface:
    model_name_or_path: "Qwen/Qwen3-4B"
    device_map: "auto"
    load_in_4bit: false
    torch_dtype: "auto"
    pipeline_task: "text-generation"
    max_new_tokens: 512
    temperature: 0.0
    return_full_text: false
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  k2: 5
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

write_gate:
  enabled: true
  tau_high: 0.45
  tau_redund: 0.92

retriever:
  mode: "rrf"
  use_bm25: true
  use_entity_filter: true
  use_temporal_boost: true
  max_hops: 2
  hop_decay: 0.70
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.8
  entity_weight: 0.6
  temporal_weight: 0.5

answer:
  direct_mode: true
  include_dates: true
  max_context_notes: 8
  max_tokens: 512
  temperature: 0.0

ingestion:
  mode: "session_batch"
  lazy_evolution: true
  link_tau: 0.35
  max_notes_per_session: 20

link_tau: 0.35

llm_retry:
  max_retries: 2

phase:
  mode: "combined"
  bank_tag: "shared"
  ingest_config: null

logging:
  level: "INFO"
  log_file: null
