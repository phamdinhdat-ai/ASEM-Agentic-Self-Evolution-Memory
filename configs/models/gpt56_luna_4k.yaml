# vgpt/gpt-5.6-luna — SMALL-CONTEXT variant (4096-token answer window)
# ---------------------------------------------------------------------------
# Same backbone and bank as `gpt56_luna.yaml`; the ONLY difference is the
# `answer` budget. Every system in a run (ASEM-THG, FastASEM, FullContext,
# NoMemory) answers with one model call under this SAME budget, so the
# comparison is apples-to-apples: it tests whether THG can beat FullContext
# when the window is too small to stuff the whole history.
#
#   answer budget = context_window - max_tokens - safety(64)
#                 = 4096 - 512 - 64 = 3520 tokens (~14 KB) for the prompt.
#
# Phase A (ingest) MUST use the original `gpt56_luna.yaml` so the frozen bank
# is byte-identical; this config is for Phase B (answer/eval) only:
#
#   python scripts/run_static_eval.py --tag gpt56_luna \
#       --config configs/models/gpt56_luna_4k.yaml --systems ASEM-THG FastASEM FullContext
# ---------------------------------------------------------------------------
preset: "custom"

inference:
  backend: "openai"
  openai:
    model: "vgpt/gpt-5.6-luna"
    temperature: 0.3
    max_tokens: 8192
    timeout: 120
    embedder_provider: "huggingface"
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  # k2 = candidates handed to the answer agent; the note payload is bounded by
  # the token budget below, not by this number alone.
  k2: 10
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

write_gate:
  enabled: true
  tau_high: 0.45
  tau_redund: 0.92

retriever:
  mode: "rrf"
  use_bm25: true
  use_entity_filter: true
  use_temporal_boost: true
  max_hops: 2
  hop_decay: 0.70
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.8
  entity_weight: 0.6
  temporal_weight: 0.5
  # ── ASEM-THG enhanced retriever (Phase 2 fixes) ─────────────────────
  multi_hop_topn: 2
  multi_hop_min_sim: 0.30
  multi_hop_min_score: 0.0
  alpha: 0.35
  beta: 0.25
  gamma: 0.40
  base_weight: 0.60
  community_boost: 1.2
  unknown_relation_weight: 1.0
  enable_global_semantics: true
  enable_intent_q: true

answer:
  direct_mode: true
  include_dates: true
  # Small window: fewer, longer notes beat many truncated ones. 6 notes at up
  # to ~400 chars each (~600 tok) leaves ample room for the instructions.
  max_context_notes: 6
  content_char_limit: 400
  max_tokens: 512
  temperature: 0.0
  context_window: 4096

ingestion:
  mode: "session_batch"
  lazy_evolution: true
  link_tau: 0.35
  max_notes_per_session: 20

link_tau: 0.35

llm_retry:
  max_retries: 1

phase:
  mode: "combined"
  bank_tag: "gpt56_luna"
  ingest_config: "configs/models/gpt56_luna.yaml"
  qa_prompt: "calibrated"

logging:
  level: "INFO"
  log_file: null
