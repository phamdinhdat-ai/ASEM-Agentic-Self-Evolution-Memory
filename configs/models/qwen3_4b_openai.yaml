# Qwen3-4B — NATIVE openai-SDK backend (no LangChain in the request path)
# ---------------------------------------------------------------------------
# Same model as `qwen3_4b_api.yaml`, but calls go straight through the official
# `openai` client (`client.chat.completions.create`) instead of LangChain's
# ChatOpenAI wrapper. Select it with `backend: "openai"`.
#
# Everything OUTSIDE the `inference` block is kept identical to
# `qwen3_4b_api.yaml` on purpose: the two backends must be comparable on one
# frozen memory bank.
#
# Endpoint + key come from .env (OPENAI_BASE_URL / OPENAI_API_KEY) unless pinned
# with `base_url` / `api_key` here.
#
# `model` MUST equal the server's --served-model-name; check with models.list().
#
# CONTEXT WINDOW: if the server runs with `--max-model-len 8192`, a long prompt
# plus a large `max_tokens` overflows it and the endpoint returns HTTP 400
# ("maximum context length is 8192 tokens. However, you requested 2048 output
# tokens and your prompt contains at least 6145 input tokens"). `answer.max_tokens`
# caps the ANSWER call per-call and `answer.context_window` makes the answer
# agent drop low-ranked notes until `prompt + max_tokens` fits — neither touches
# the ingestion budget. If you can, prefer raising `--max-model-len` (Qwen3-4B is
# natively 32k) instead of relying on the trim.
#
# Embeddings are built by the SAME embedder factory the LangChain backend uses
# (`_build_embedder`), so vectors are identical: banks built with
# `backend: "langchain"` (e.g. qwen3_4b_api.yaml) are interchangeable with this
# one, and ingest/retrieve phases may use different backends. `embedder_name`
# MUST stay `sentence-transformers/all-MiniLM-L6-v2`.
#
#   python scripts/build_static_banks.py --tag <tag> --ingest-config configs/models/qwen3_4b_openai.yaml
#   python scripts/run_static_eval.py   --tag <tag> --config        configs/models/qwen3_4b_openai.yaml
# ---------------------------------------------------------------------------
preset: "custom"

inference:
  backend: "openai"
  openai:
    model: "Qwen/Qwen3-4B"
    temperature: 0.0
    # Client-wide default, used by BOTH the ingestion extraction call (which
    # returns a whole JSON array) and any call that does not pass its own cap.
    # The answer path passes `answer.max_tokens` per call, so this stays
    # generous for ingestion.
    max_tokens: 2048
    timeout: 120          # seconds; long extraction calls need headroom

    # ---- Thinking control ------------------------------------------------
    # Qwen3-4B is a THINKING model: it emits a  thinking block whose tokens count
    # against `max_tokens`. Disable it so the window is spent on the answer
    # (this matches `enable_reasoning: false` in qwen3_4b_api.yaml).
    #
    # For the NON-thinking build (e.g. "Qwen/Qwen3-4B-Instruct-2507") DELETE
    # this block.
    #
    # Other OpenAI-compatible forms: `thinking: {type: enabled|disabled}`,
    # `reasoning_effort: low|high|max`, or `enable_reasoning: true` for the
    # older vLLM `chat_template_kwargs.enable_thinking` convention.
    # `extra_body` is merged LAST, so a raw override here always wins.
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

    embedder_provider: "huggingface"
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  k2: 5
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

write_gate:
  enabled: true
  tau_high: 0.45
  tau_redund: 0.92

retriever:
  mode: "rrf"
  use_bm25: true
  use_entity_filter: true
  use_temporal_boost: true
  max_hops: 2
  hop_decay: 0.70
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.8
  entity_weight: 0.6
  temporal_weight: 0.5

answer:
  direct_mode: true
  include_dates: true
  max_context_notes: 8
  # Per-call output cap for the answer (the generation is a few words, so 512 is
  # ample). Without this the client-wide `inference.openai.max_tokens` is used.
  max_tokens: 512
  # Served window. The answer prompt is trimmed so that
  # `prompt + max_tokens <= context_window` — otherwise a long prompt 400s on a
  # small-context server (e.g. 6145 + 2048 > 8192).
  context_window: 8192
  temperature: 0.0

ingestion:
  mode: "session_batch"
  lazy_evolution: true
  link_tau: 0.35
  max_notes_per_session: 20

link_tau: 0.35

llm_retry:
  max_retries: 1

phase:
  mode: "combined"
  bank_tag: "shared"
  ingest_config: null

logging:
  level: "INFO"
  log_file: null
