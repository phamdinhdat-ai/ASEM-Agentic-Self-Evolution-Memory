# DeepSeek — OpenAI-compatible API backend
# ---------------------------------------------------------------------------
# Endpoint + key from .env: OPENAI_BASE_URL (https://api.deepseek.com),
# OPENAI_API_KEY.
#
# Models actually served by this endpoint (checked with models.list()):
#     deepseek-flash      reasoning model, clean JSON, ~150 reasoning tokens/call
#     deepseek-v4-pro     reasoning-heavy: needs a LARGE max_tokens or it
#                         returns an EMPTY string (all budget spent thinking)
#   `deepseek-chat` also works and is the cheap non-reasoning option: it emits
#   no reasoning tokens, so it is the fastest/cheapest for bulk ingestion.
#
# `model` below MUST be a name the endpoint serves. Change this one line to
# switch; nothing else in the pipeline needs to change.
#
# IMPORTANT: `max_tokens` must cover REASONING + OUTPUT. These models spend
# tokens thinking before emitting the JSON, so a tight budget yields
# finish_reason="length" with empty content -> a bank with 0 notes.
#
# IMPORTANT: `embedder_name` MUST match every other config in `configs/models/`
# (all-MiniLM-L6-v2). Ingestion stores embedder vectors in the bank, so the
# ingest and retrieval phases must agree on it.
#
#   python scripts/build_static_banks.py --ingest-config configs/models/deepseek_api.yaml
#   python scripts/run_static_eval.py   --config        configs/models/deepseek_api.yaml
# ---------------------------------------------------------------------------
preset: "custom"

inference:
  backend: "langchain"
  langchain:
    provider: "openai"
    model: "deepseek-v4-flash"
    temperature: 0.3
    max_tokens: 4096
    enable_reasoning: false
    # Thinking control is supported on this (LangChain) path too — same keys:
    #   thinking:         {type: "enabled" | "disabled"}
    #   reasoning_effort: "low" | "high" | "max"
    # Left off here so banks stay consistent with runs already ingested;
    # `deepseek_openai.yaml` ships with `thinking: {type: disabled}`.
    embedder_provider: "huggingface"
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  k2: 5
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

write_gate:
  enabled: true
  tau_high: 0.45
  tau_redund: 0.92

retriever:
  mode: "rrf"
  use_bm25: true
  use_entity_filter: true
  use_temporal_boost: true
  max_hops: 2
  hop_decay: 0.70
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.8
  entity_weight: 0.6
  temporal_weight: 0.5

answer:
  direct_mode: true
  include_dates: true
  max_context_notes: 8
  max_tokens: 512
  temperature: 0.0

ingestion:
  mode: "session_batch"
  lazy_evolution: true
  link_tau: 0.35
  max_notes_per_session: 20

link_tau: 0.35

llm_retry:
  max_retries: 1

phase:
  mode: "combined"
  bank_tag: "deepseek"
  ingest_config: null

logging:
  level: "INFO"
  log_file: null
