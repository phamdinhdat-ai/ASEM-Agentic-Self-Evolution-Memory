# gpt-5.4 — OpenAI-compatible API backend
# ---------------------------------------------------------------------------
# Served by any /v1/chat/completions endpoint (vLLM, LM Studio, proxy).
# Endpoint + key from .env: OPENAI_BASE_URL, OPENAI_API_KEY.
#
# `model` MUST equal the server's `--served-model-name`. The repo `.env`
# points at https://api.xah.io/v1 and sets LLM_MODEL="gpt-5.4"; keep the two
# in sync or override with --config on the command line.
#
# IMPORTANT: `embedder_name` MUST match every other config in `configs/models/`
# (all-MiniLM-L6-v2). Ingestion stores embedder vectors in the bank, so the
# ingest and retrieval phases must agree on it.
#
# Used as the default ingest + answer backbone for the static-bank pipeline:
#   python scripts/build_static_banks.py --ingest-config configs/models/gpt54_api.yaml
#   python scripts/run_static_eval.py   --config        configs/models/gpt54_api.yaml
# ---------------------------------------------------------------------------
preset: "custom"

inference:
  backend: "langchain"
  langchain:
    provider: "openai"
    model: "gpt-5.4"
    temperature: 0.0
    max_tokens: 2048
    enable_reasoning: false
    embedder_provider: "huggingface"
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  k2: 5
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

write_gate:
  enabled: true
  tau_high: 0.45
  tau_redund: 0.92

retriever:
  mode: "rrf"
  use_bm25: true
  use_entity_filter: true
  use_temporal_boost: true
  max_hops: 2
  hop_decay: 0.70
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.8
  entity_weight: 0.6
  temporal_weight: 0.5

answer:
  direct_mode: true
  include_dates: true
  max_context_notes: 8
  max_tokens: 512
  temperature: 0.0

ingestion:
  mode: "session_batch"
  lazy_evolution: true
  link_tau: 0.35
  max_notes_per_session: 20

link_tau: 0.35

llm_retry:
  max_retries: 1

phase:
  mode: "combined"
  bank_tag: "gpt54"
  ingest_config: null

logging:
  level: "INFO"
  log_file: null
