# Model registry — phase-separated retrieval benchmark
# ===========================================================================
# Maps short model tags to backbone configs so a single retrieval sweep can
# iterate many backbone sizes against ONE shared, pre-ingested bank.
#
#   python scripts/run_phase_benchmark.py --phase retrieve \
#       --models qwen3_1.7b_hf qwen2.5_1.5b_hf qwen3_4b_hf
#
# RULE: every config listed here MUST use the same `embedder_name` (below).
# The embedder produces the note/query vectors stored in the bank, so mixing
# embedders across the ingest and retrieve phases is not supported.
# ===========================================================================

embedder: "sentence-transformers/all-MiniLM-L6-v2"

models:
  # ---- local HuggingFace (offline; CPU-capable) --------------------------
  qwen3_1.7b_hf:
    size_b: 1.7
    backend: "huggingface"
    model_id: "Qwen/Qwen3-1.7B"
    config: "configs/models/qwen3_1.7b_hf.yaml"

  qwen2.5_1.5b_hf:
    size_b: 1.5
    backend: "huggingface"
    model_id: "Qwen/Qwen2.5-1.5B-Instruct"
    config: "configs/models/qwen2.5_1.5b_hf.yaml"

  qwen3_4b_hf:
    size_b: 4.0
    backend: "huggingface"
    model_id: "Qwen/Qwen3-4B"
    config: "configs/models/qwen3_4b_hf.yaml"

  # ---- OpenAI-compatible API (vLLM / proxy) ------------------------------
  qwen3_1.7b_api:
    size_b: 1.7
    backend: "langchain"
    model_id: "Qwen/Qwen3-1.7B"
    config: "configs/models/qwen3_1.7b_api.yaml"

  qwen2.5_1.5b_api:
    size_b: 1.5
    backend: "langchain"
    model_id: "Qwen/Qwen2.5-1.5B-Instruct"
    config: "configs/models/qwen2.5_1.5b_api.yaml"

  qwen3_4b_api:
    size_b: 4.0
    backend: "langchain"
    model_id: "Qwen/Qwen3-4B"
    config: "configs/models/qwen3_4b_api.yaml"

  # ---- static-bank defaults (see configs/models/README.md and static/README.md)
  # DeepSeek is the backbone actually used for ingestion, answering, and
  # (via judge_api) LLM-as-a-judge grading. `model` in these configs MUST be a
  # name the endpoint in .env serves; check with models.list().
  deepseek_api:
    size_b: 0.0
    backend: "langchain"
    model_id: "deepseek-v4-flash"
    config: "configs/models/deepseek_api.yaml"

  # Same endpoint/model as deepseek_api, but via the native openai SDK client
  # (no ChatOpenAI wrapper). Banks built by either config are interchangeable.
  deepseek_openai:
    size_b: 0.0
    backend: "openai"
    model_id: "deepseek-v4-flash"
    config: "configs/models/deepseek_openai.yaml"

  judge_api:
    size_b: 0.0
    backend: "langchain"
    model_id: "deepseek-v4-flash"
    config: "configs/models/judge_api.yaml"

  # Kept for the api.xah.io endpoint; unused by the DeepSeek pipeline.
  gpt54_api:
    size_b: 0.0
    backend: "langchain"
    model_id: "gpt-5.4"
    config: "configs/models/gpt54_api.yaml"

# Convenience groups usable with --models-group
groups:
  hf_small: ["qwen3_1.7b_hf", "qwen2.5_1.5b_hf", "qwen3_4b_hf"]
  api_small: ["qwen3_1.7b_api", "qwen2.5_1.5b_api", "qwen3_4b_api"]
  api_proxy: ["deepseek_api", "deepseek_openai"]
  all: ["qwen3_1.7b_hf", "qwen2.5_1.5b_hf", "qwen3_4b_hf",
        "qwen3_1.7b_api", "qwen2.5_1.5b_api", "qwen3_4b_api",
        "deepseek_api"]
