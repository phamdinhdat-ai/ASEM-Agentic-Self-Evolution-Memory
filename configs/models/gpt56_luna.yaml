# vgpt/gpt-5.6-luna — OpenAI-compatible API backend
# ---------------------------------------------------------------------------
# Uses OPENAI_BASE_URL and OPENAI_API_KEY from .env.
# Model: vgpt/gpt-5.6-luna (from .env LLM_MODEL).
#
# IMPORTANT: `embedder_name` MUST match every other config in configs/models/
# (all-MiniLM-L6-v2). Ingestion stores embedder vectors in the bank, so the
# ingest and retrieval phases must agree on it.
#
#   python scripts/build_static_banks.py --ingest-config configs/models/gpt56_luna.yaml
#   python scripts/run_static_eval.py   --config        configs/models/gpt56_luna.yaml
# ---------------------------------------------------------------------------
preset: "custom"

inference:
  backend: "openai"
  openai:
    model: "vgpt/gpt-5.6-luna"
    temperature: 0.3
    max_tokens: 8192
    timeout: 120
    embedder_provider: "huggingface"
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  k2: 5
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

write_gate:
  enabled: true
  tau_high: 0.45
  tau_redund: 0.92

retriever:
  mode: "rrf"
  use_bm25: true
  use_entity_filter: true
  use_temporal_boost: true
  max_hops: 2
  hop_decay: 0.70
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.8
  entity_weight: 0.6
  temporal_weight: 0.5

answer:
  direct_mode: true
  include_dates: true
  max_context_notes: 8
  content_char_limit: 200
  max_tokens: 512
  temperature: 0.0
  context_window: 32768

ingestion:
  mode: "session_batch"
  lazy_evolution: true
  link_tau: 0.35
  max_notes_per_session: 20

link_tau: 0.35

llm_retry:
  max_retries: 1

phase:
  mode: "combined"
  bank_tag: "gpt56_luna"
  ingest_config: null

logging:
  level: "INFO"
  log_file: null
