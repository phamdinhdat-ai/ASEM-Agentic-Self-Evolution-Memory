# chib/deepseek-v4.1-flash — OpenAI-compatible API backend
# ---------------------------------------------------------------------------
# Uses OPENAI_BASE_URL and OPENAI_API_KEY from .env.
# Model: chib/deepseek-v4.1-flash (from .env LLM_MODEL).
#
# IMPORTANT: `embedder_name` MUST match every other config in configs/models/
# (all-MiniLM-L6-v2). Ingestion stores embedder vectors in the bank, so the
# ingest and retrieval phases must agree on it.
#
# Backbone swap only: bank_tag stays "gpt56_luna" so the FROZEN banks built
# with vgpt/gpt-5.6-luna are reused for retrieval (no re-ingest). This is the
# standard "swap the backbone, reuse the bank" protocol the repo already uses.
#
#   python scripts/run_static_eval.py --config configs/models/deepseek_v41_flash.yaml
# ---------------------------------------------------------------------------
preset: "custom"

inference:
  backend: "openai"
  openai:
    model: "chib/deepseek-v4.1-flash"
    temperature: 0.3
    max_tokens: 8192
    timeout: 120
    embedder_provider: "huggingface"
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  # k2 = final candidate count handed to the answer agent. Raised 5 -> 10 so a
  # relevant note is not evicted by link-neighbours; the answer token budget
  # (answer.max_context_notes) still bounds what reaches the prompt.
  k2: 10
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

write_gate:
  enabled: true
  tau_high: 0.45
  tau_redund: 0.92

retriever:
  mode: "rrf"
  use_bm25: true
  use_entity_filter: true
  use_temporal_boost: true
  max_hops: 2
  hop_decay: 0.70
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.8
  entity_weight: 0.6
  temporal_weight: 0.5
  # ── ASEM-THG enhanced retriever (Phase 2 fixes) ─────────────────────
  # multi_hop_topn was 5 (relevance-blind); now capped and similarity-gated.
  multi_hop_topn: 2
  multi_hop_min_sim: 0.30
  multi_hop_min_score: 0.0
  # ── G2: typed heterogeneous Personalized PageRank ────────────────────
  # Phase C is ONE walk over the hyper-graph, replacing the old pair (a bounded
  # BFS + a type-blind PPR append). Its transition matrix carries each edge's
  # relation type and its reset distribution carries the entity nodes the
  # question names. `use_graph_rank: false` is the "graph is dark" ablation rung.
  use_graph_rank: true
  # Transition weights: null derives them from `relation_weights` above, so the
  # typed table that only the BFS used to consult now governs the walk too.
  # Set explicitly (relation -> weight) to ablate a single relation's weight.
  ppr_edge_weights: null
  # PageRank teleport factor; 0.85 is the networkx default.
  ppr_damping: 0.85
  # Entity-anchored seeding (HippoRAG 2's reset scheme over typed edges). The
  # share of reset mass given to query-named entity nodes, and how many may seed.
  # 0.0 reproduces the pre-G2 note-only seeding exactly.
  entity_seed_weight: 0.5
  entity_seed_topn: 5
  # How many walk-ranked notes may enter the pool, and an optional similarity
  # floor for them (0.0 = off; the walk's append measured as a recall GAIN).
  graph_rank_topn: 20
  graph_rank_min_sim: 0.0
  # ── G3: multi-hop query decomposition ────────────────────────────────
  # off       = no planner (byte-for-byte the pre-G3 behaviour)
  # heuristic = split on "and"/"or"/";" when the classifier reads reasoning/mixed
  # llm       = one backbone call for the sub-questions, heuristic on failure
  # The G3 probes showed the missing hop's evidence is usually ABSENT from the
  # pool for the original query (13 of 16 incomplete cat-1 questions), so no
  # re-ranking recovers it; a different query does (oracle: 16/16).
  query_planner: "off"
  max_subquestions: 3
  planner_fuse_weight: 1.0
  # Phase D blend: base ordering keeps primacy; graph/utility refine it.
  alpha: 0.35
  beta: 0.25
  gamma: 0.40
  base_weight: 0.60
  community_boost: 1.2
  unknown_relation_weight: 1.0
  enable_global_semantics: true
  enable_intent_q: true

# G1: hyper-graph construction knobs, previously hard-coded in
# `TemporalHyperGraph.__init__`. The defaults below reproduce the historical
# values byte-for-byte, so an unchanged config behaves exactly as before.
hyper_graph:
  # Hydrate the graph from an existing bank at build time. Without this the
  # frozen-bank eval path built an EMPTY graph: `_fact_nodes` was empty,
  # `personalized_pagerank` returned [] for every query, and `ppr_weight` was
  # inert in every published number. `false` is the "graph is dark" ablation
  # rung — same bank, same config, graph off.
  hydrate_on_load: true
  # Entity-node edge threshold and fan-out caps.
  semantic_tau: 0.70
  max_entity_links: 5
  max_semantic_links: 5
  # Hub suppression: entity keys at or below this smoothed idf are ignored.
  # -.inf = down-weight hubs but never drop them (production default).
  entity_idf_floor: -.inf
  # GB2e: supersession stays OFF (0/5 precision on the frozen bank).
  supersession: false

answer:
  direct_mode: true
  include_dates: true
  max_context_notes: 8
  content_char_limit: 200
  max_tokens: 512
  temperature: 0.0
  context_window: 32768
  # W10 retrieval-context style.
  #   "legacy" (default) = the historical rendering, byte-for-byte. Every frozen
  #            bank result and published number stays reproducible.
  #   "thg_v1"           = session provenance in each block header, an
  #            "Evidence chains" section for multi-hop bridges, question-aware
  #            structure (Date anchors / chronological positions / current-fact
  #            first with a `superseded` marker) and render drop counters.
  # The two arms differ in exactly this one flag, so an ablation is a one-line
  # config change and no other code path moves.
  context_style: "legacy"

ingestion:
  mode: "session_batch"
  lazy_evolution: true
  link_tau: 0.35
  max_notes_per_session: 20

link_tau: 0.35

llm_retry:
  max_retries: 1

phase:
  mode: "combined"
  bank_tag: "gpt56_luna"
  ingest_config: null
  # QA baseline prompt: "calibrated" (default) | "trap" (ablation only).
  qa_prompt: "calibrated"

logging:
  level: "INFO"
  log_file: null

# WS2 thg_v2_postfix arm: production defaults (hyper_graph.supersession OFF).
