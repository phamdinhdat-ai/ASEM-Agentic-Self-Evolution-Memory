# Qwen2.5-1.5B-Instruct — local HuggingFace backend
# ---------------------------------------------------------------------------
# Phase-separated benchmark backbone config (~1.5B params).
#
# IMPORTANT: `embedder_name` MUST be identical across every config in
# `configs/models/`. A memory bank ingested by one backbone can then be
# retrieved/answered by a different backbone, because notes store text plus
# embeddings produced by the SHARED embedder (not by the LLM).
# ---------------------------------------------------------------------------
preset: "custom"            # self-contained; do NOT merge a preset

inference:
  backend: "huggingface"
  huggingface:
    model_name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"
    device_map: "auto"      # "auto" | "cpu" | "cuda:0"
    load_in_4bit: false     # requires CUDA + bitsandbytes; keep false on CPU
    torch_dtype: "auto"     # "float32" for max CPU stability, "bfloat16" to save RAM
    pipeline_task: "text-generation"
    max_new_tokens: 512     # honored by the HF backend (see huggingface_backend.py)
    temperature: 0.0
    return_full_text: false
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  k2: 5
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

write_gate:
  enabled: true
  tau_high: 0.45
  tau_redund: 0.92

retriever:
  mode: "rrf"
  use_bm25: true
  use_entity_filter: true
  use_temporal_boost: true
  max_hops: 2
  hop_decay: 0.70
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.8
  entity_weight: 0.6
  temporal_weight: 0.5

answer:
  direct_mode: true
  include_dates: true
  max_context_notes: 8
  content_char_limit: 200
  max_tokens: 512
  temperature: 0.0

ingestion:
  mode: "session_batch"
  lazy_evolution: true
  link_tau: 0.35
  max_notes_per_session: 20

link_tau: 0.35

# Small models drift from strict JSON — retries help them converge.
llm_retry:
  max_retries: 2

# Phase control (CLI --phase overrides this default).
phase:
  mode: "combined"        # "ingest" | "retrieve" | "combined"
  bank_tag: "shared"      # shared bank dir reused by retrieval sweeps
  ingest_config: null     # null => this config builds the banks

logging:
  level: "INFO"
  log_file: null
