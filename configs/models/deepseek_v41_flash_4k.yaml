# chib/deepseek-v4.1-flash — 4K answer budget variant (Phase B ONLY)
# ---------------------------------------------------------------------------
# IDENTICAL to configs/models/deepseek_v41_flash.yaml except the answer budget:
# a hard 4096-token context window so ASEM-THG competes on the SAME budget as
# FullContext-4K.
#
# DO NOT use this config to ingest — banks are frozen and shared via
# phase.bank_tag = "gpt56_luna". This is a retrieval/answer-time config only.
#
#   python scripts/run_static_eval.py --tag gpt56_luna \
#       --config configs/models/deepseek_v41_flash_4k.yaml \
#       --judge-config configs/models/judge_api.yaml --metrics em f1 rougeL bertscore_f1 judge
#
# Budget arithmetic: 4096 - 512 (max_tokens) - 64 (safety) = 3520 prompt tokens.
# ---------------------------------------------------------------------------
preset: "custom"

inference:
  backend: "openai"
  openai:
    model: "chib/deepseek-v4.1-flash"
    temperature: 0.3
    max_tokens: 8192
    timeout: 120
    embedder_provider: "huggingface"
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  k2: 10
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

write_gate:
  enabled: true
  tau_high: 0.45
  tau_redund: 0.92

retriever:
  mode: "rrf"
  use_bm25: true
  use_entity_filter: true
  use_temporal_boost: true
  max_hops: 2
  hop_decay: 0.70
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.8
  entity_weight: 0.6
  temporal_weight: 0.5
  multi_hop_topn: 2
  multi_hop_min_sim: 0.30
  multi_hop_min_score: 0.0
  alpha: 0.35
  beta: 0.25
  gamma: 0.40
  base_weight: 0.60
  community_boost: 1.2
  unknown_relation_weight: 1.0
  enable_global_semantics: true
  enable_intent_q: true

answer:
  direct_mode: true
  include_dates: true
  # More notes at a shorter char limit survive the 4K clip better than fewer
  # long ones (ranking is trustworthy after the Phase 2 retrieval fixes).
  max_context_notes: 6
  content_char_limit: 400
  max_tokens: 512
  temperature: 0.0
  context_window: 4096

ingestion:
  mode: "session_batch"
  lazy_evolution: true
  link_tau: 0.35
  max_notes_per_session: 20

link_tau: 0.35

llm_retry:
  max_retries: 1

phase:
  mode: "combined"
  bank_tag: "gpt56_luna"
  ingest_config: null
  qa_prompt: "calibrated"

logging:
  level: "INFO"
  log_file: null
