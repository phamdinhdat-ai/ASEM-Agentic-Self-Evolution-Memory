
# IMPORTANT: `embedder_name` MUST match every other config in `configs/models/`
# (all-MiniLM-L6-v2). Ingestion stores embedder vectors in the bank, so the
# ingest and retrieval phases must agree on it.
#
# Used as the default ingest + answer backbone for the static-bank pipeline:
#   python scripts/build_static_banks.py --ingest-config configs/models/gpt54_api.yaml
#   python scripts/run_static_eval.py   --config        configs/models/gpt54_api.yaml
# ---------------------------------------------------------------------------
preset: "custom"

inference:
  backend: "langchain"
  langchain:
    provider: "openai"
    model: "deepseek-v4-flash"
    base_url: "https://api.deepseek.com"
    temperature: 0.3
    max_tokens: 2048
    enable_reasoning: false
    embedder_provider: "huggingface"
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20
  k2: 5
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

write_gate:
  enabled: true
  tau_high: 0.45
  tau_redund: 0.92

retriever:
  mode: "rrf"
  use_bm25: true
  use_entity_filter: true
  use_temporal_boost: true
  max_hops: 2
  hop_decay: 0.70
  rrf_k: 60
  dense_weight: 1.0
  bm25_weight: 0.8
  entity_weight: 0.6
  temporal_weight: 0.5

answer:
  direct_mode: true
  include_dates: true
  max_context_notes: 8
  content_char_limit: 200
  # Per-call completion cap for the ANSWER path (ingestion keeps
  # `inference.langchain.max_tokens`).
  max_tokens: 512
  temperature: 0.0
  # Model context window for the ANSWER call (prompt + completion). Every
  # system - ASEM and each baseline (FullContext included) - trims its history
  # and retrieved context so that `prompt + max_tokens <= context_window`, and
  # all arms answer under the same budget. Raise it to the served window to
  # allow longer histories; unset = no trimming (old behaviour).
  context_window: 32768

ingestion:
  mode: "session_batch"
  lazy_evolution: true
  link_tau: 0.35
  max_notes_per_session: 20

link_tau: 0.35

llm_retry:
  max_retries: 1

phase:
  mode: "combined"
  bank_tag: "deepseek-v4-flash"
  ingest_config: null

logging:
  level: "INFO"
  log_file: null
