inference:
  backend: "langchain"
  langchain:
    provider: "openai"                    # vLLM exposes an OpenAI-compatible /v1/chat/completions endpoint
    model: "Qwen/Qwen3-4B-2507"                    # must match the --served-model-name of your vLLM server
    temperature: 0.0
    embedder_provider: "huggingface"      # vLLM does not serve embeddings; use local HF embedder
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"

hyperparameters:
  k1: 20  
  k2: 5
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

# NGMC write gate — skip the S2 LLM for clearly-novel (ADD) / near-duplicate (NOOP) turns
write_gate:
  enabled: true
  tau_high: 0.45      # novelty = 1 - max_sim; ADD when novelty >= tau_high
  tau_redund: 0.92    # NOOP when max_sim >= tau_redund (near-duplicate)
link_tau: 0.35        # only feed the S3 link LLM neighbors at/above this cosine
