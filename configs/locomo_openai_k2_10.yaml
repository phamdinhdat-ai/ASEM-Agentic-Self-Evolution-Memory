inference:
  backend: "langchain"
  langchain:
    provider: "openai"
    model: "deepseek-v4-flash"          # using ckey.vn proxy; swap to gpt-4o, gpt-4o-mini, etc.
    temperature: 0.5
    reasoning: false
    max_tokens: 8192                    # raise output cap: large batch-link arrays get truncated at the API default (4096)
    embedder_provider: "huggingface"
    embedder_name: "sentence-transformers/all-MiniLM-L6-v2"  # cheap + fast; swap to text-embedding-3-large for higher quality

hyperparameters:
  k1: 20
  k2: 10
  k: 5
  delta: 0.30
  lambda: 0.40
  alpha: 0.10
  q0: 0.50

# NGMC write gate — skip the S2 LLM for clearly-novel (ADD) / near-duplicate (NOOP) turns
write_gate:
  enabled: true
  tau_high: 0.45      # novelty = 1 - max_sim; ADD when novelty >= tau_high
  tau_redund: 0.92    # NOOP when max_sim >= tau_redund (near-duplicate)
link_tau: 0.35        # only feed the S3 link LLM neighbors at/above this cosine

# LLM output retry — on parse/schema failure, re-issue the prompt with a format
# correction block quoting the previous bad output (0 = disabled, single-shot)
llm_retry:
  max_retries: 0      # strong API models rarely fail; keep benchmark cost unchanged

# Optional: configure loguru logging
# Set LOG_LEVEL env var or use the level below. File logging is optional.
logging:
  level: "DEBUG"               # TRACE, DEBUG, INFO, SUCCESS, WARNING, ERROR, CRITICAL
  log_file: "logs/asem.log"    # set to null to disable file logging
  rotation: "10 MB"
  retention: "7 days"
  serialize_json: false
